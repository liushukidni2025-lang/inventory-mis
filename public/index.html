<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>库存管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath fill='white' d='M8 11.5L16 7l8 4.5V21l-8 4.5L8 21V11.5zm8 1.2l5.2-2.9L16 8.2l-5.2 2.6L16 12.7zM10 13.6v6.2l5 2.8v-6.2l-5-2.8zm7 9l5-2.8v-6.2l-5 2.8v6.2z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>
        </div>
        <div>
          <h1>库存管理系统</h1>
        </div>
      </div>
      <p class="lead">请登录后使用。管理员、库管员与只读账号权限不同。</p>
      <div class="login-error" id="loginError"></div>
      <label class="field">用户名
        <input type="text" name="username" id="loginUser" required maxlength="30" autocomplete="username" />
      </label>
      <label class="field">密码
        <input type="password" name="password" id="loginPass" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary" id="loginBtn">登录</button>
      <p class="login-foot">首次部署时，管理员初始密码会打印在服务器控制台。</p>
    </form>
  </div>

  <div class="app" id="appShell" hidden>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>
        </div>
        <div>
          <h1>库存管理系统</h1>
          <p>多人 · 多仓库 · 条码</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">数据保存在服务器 SQLite 数据库<br>建议定期导出备份</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="menu-btn" id="menuBtn" aria-label="打开菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="page-title" id="pageTitle">仪表盘</div>
        </div>
        <div class="topbar-right user-box">
          <form class="scan-box" id="scanForm" title="输入或扫描商品编码">
            <input type="search" id="scanInput" placeholder="扫码 / 输入编码" maxlength="40" />
          </form>
          <div class="user-meta">
            <div class="name" id="userName"></div>
            <div class="role" id="userRole"></div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="btnPassword">改密</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnLogout">退出</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-hd">
        <h3 id="modalTitle"></h3>
        <button type="button" class="icon-btn" id="modalClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-bd" id="modalBody"></div>
      <div class="modal-ft" id="modalFoot"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <div class="label-page" id="labelPage"></div>

  <script src="/js/barcode.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
